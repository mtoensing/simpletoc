name: Deploy to WordPress.org

on:
  push:
    tags:
      - '*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/codingstandard.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  phpunit:
    uses: ./.github/workflows/phpunit.yml

  tag:
    name: New tag
    needs: [lint, e2e, phpunit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify release versions match the tag
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', tag), 'Expected a numeric release tag'
          versions = {
              'plugin.php': re.search(r'Version:\s*(\S+)', Path('plugin.php').read_text()).group(1),
              'readme.txt': re.search(r'Stable tag:\s*(\S+)', Path('readme.txt').read_text()).group(1),
          }
          for filename in ('src/block.json', 'build/block.json', 'package.json', 'package-lock.json'):
              versions[filename] = json.loads(Path(filename).read_text())['version']
          versions['package-lock.json root'] = json.loads(Path('package-lock.json').read_text())['packages']['']['version']
          for filename, version in versions.items():
              assert version == tag, f'{filename}: {version} does not match tag {tag}'
          print(f'All release versions match {tag}')
          PY

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-20-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}

      - name: Create GitHub release after successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "SimpleTOC $GITHUB_REF_NAME" --generate-notes
          fi
